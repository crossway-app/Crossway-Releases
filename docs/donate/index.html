<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="0;url=../#donate">
<title>Donate to Crossway</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<script>try{var v=localStorage.getItem("crossway-night");if(v==="1")document.documentElement.classList.add("night");else if(v==="0")document.documentElement.classList.add("day");if(localStorage.getItem("crossway-hacker")==="1")document.documentElement.classList.add("hacker");if(localStorage.getItem("crossway-retro")==="1")document.documentElement.classList.add("retro")}catch(e){}</script>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<!-- This page IS the canonical donate URL (https://crosswayapp.com/donate/)
     baked into the app and FUNDING.yml. It stays a stable address the
     project controls; today it lands on the donate dialog, and it can be
     re-pointed later without shipping an app update. -->
<main class="desktop">
  <section class="mac-dialog" aria-label="Redirecting">
    <div class="dialog-body">
      <div>
        <h2>One moment…</h2>
        <p>Taking you to the donate dialog.</p>
        <div class="btn-row">
          <a class="btn btn-default" href="../#donate">Continue</a>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
