<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="0;url=../#donate">
<title>Donate to Crossway</title>
<meta name="robots" content="noindex">
<meta name="description" content="Crossway is free. If you would like to say thank you and support an independent app, donations are always appreciated.">
<meta property="og:site_name" content="Crossway">
<meta property="og:type" content="website">
<meta property="og:title" content="Donate to Crossway">
<meta property="og:description" content="Crossway is free. If you would like to say thank you and support an independent app, donations are always appreciated.">
<meta property="og:url" content="https://crosswayapp.com/donate/">
<meta property="og:image" content="https://crosswayapp.com/assets/social-card-1b4af3a9.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Crossway's app switcher open on a Mac display, showing a preview of each window of the selected app, beside the keys that drive it.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<script>try{var v=localStorage.getItem("crossway-night");if(v==="1")document.documentElement.classList.add("night");else if(v==="0")document.documentElement.classList.add("day");if(localStorage.getItem("crossway-hacker")==="1")document.documentElement.classList.add("hacker");if(localStorage.getItem("crossway-retro")==="1")document.documentElement.classList.add("retro")}catch(e){}</script>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<!-- This page IS the canonical donate URL (https://crosswayapp.com/donate/)
     baked into the app and FUNDING.yml. It stays a stable address the
     project controls; today it lands on the donate dialog, and it can be
     re-pointed later without shipping an app update. -->
<main class="desktop">
  <section class="mac-dialog" aria-label="Redirecting">
    <div class="dialog-body">
      <div>
        <h2>One moment…</h2>
        <p>Taking you to the donate dialog.</p>
        <div class="btn-row">
          <a class="btn btn-default" href="../#donate">Continue</a>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
